  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('mlplayground-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BNNG588WK9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    // send_page_view: false — we fire pageviews ourselves per SPA route in app.js,
    // so lesson names appear as distinct pages instead of just "index.html"
    gtag('config', 'G-BNNG588WK9', { send_page_view: false });
  </script>
