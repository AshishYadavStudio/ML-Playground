<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1e"/>
      <stop offset="0.55" stop-color="#0f1030"/>
      <stop offset="1" stop-color="#0a1b26"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0" r="0.6">
      <stop offset="0" stop-color="#6d8dff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#4fd6c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4fd6c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#6d8dff"/>
      <stop offset="0.55" stop-color="#b78cff"/>
      <stop offset="1" stop-color="#4fd6c5"/>
    </linearGradient>
    <linearGradient id="chipBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d8dff"/>
      <stop offset="1" stop-color="#b78cff"/>
    </linearGradient>
  </defs>

  <!-- background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- neural network pattern (right side) -->
  <g opacity="0.7" transform="translate(720,60)">
    <!-- edges -->
    <g stroke="#6d8dff" stroke-opacity="0.28" stroke-width="1.4" fill="none">
      <line x1="60" y1="90"  x2="220" y2="60"/>
      <line x1="60" y1="90"  x2="220" y2="180"/>
      <line x1="60" y1="220" x2="220" y2="60"/>
      <line x1="60" y1="220" x2="220" y2="180"/>
      <line x1="60" y1="220" x2="220" y2="330"/>
      <line x1="60" y1="360" x2="220" y2="180"/>
      <line x1="60" y1="360" x2="220" y2="330"/>
      <line x1="220" y1="60"  x2="380" y2="120"/>
      <line x1="220" y1="60"  x2="380" y2="260"/>
      <line x1="220" y1="180" x2="380" y2="120"/>
      <line x1="220" y1="180" x2="380" y2="260"/>
      <line x1="220" y1="330" x2="380" y2="120"/>
      <line x1="220" y1="330" x2="380" y2="260"/>
      <line x1="220" y1="330" x2="380" y2="380"/>
      <line x1="380" y1="120" x2="440" y2="220"/>
      <line x1="380" y1="260" x2="440" y2="220"/>
      <line x1="380" y1="380" x2="440" y2="220"/>
    </g>
    <!-- nodes with glow -->
    <g>
      <circle cx="60"  cy="90"  r="8" fill="#b78cff"/>
      <circle cx="60"  cy="220" r="8" fill="#b78cff"/>
      <circle cx="60"  cy="360" r="8" fill="#b78cff"/>
      <circle cx="220" cy="60"  r="8" fill="#6d8dff"/>
      <circle cx="220" cy="180" r="8" fill="#6d8dff"/>
      <circle cx="220" cy="330" r="8" fill="#6d8dff"/>
      <circle cx="380" cy="120" r="8" fill="#6d8dff"/>
      <circle cx="380" cy="260" r="8" fill="#6d8dff"/>
      <circle cx="380" cy="380" r="8" fill="#6d8dff"/>
      <circle cx="440" cy="220" r="10" fill="#4fd6c5"/>
    </g>
  </g>

  <!-- top-left brand chip -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="270" height="52" rx="26" fill="rgba(109,141,255,0.12)" stroke="rgba(109,141,255,0.42)" stroke-width="1"/>
    <circle cx="30" cy="26" r="6" fill="#4ade80"/>
    <text x="52" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#6d8dff" letter-spacing="1">37 LESSONS · 100% FREE</text>
  </g>

  <!-- headline -->
  <g transform="translate(80,190)">
    <text font-family="Sora, Inter, sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="#eaf0fa">Learn Machine</text>
    <text y="90" font-family="Sora, Inter, sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="#eaf0fa">Learning</text>
    <text x="368" y="90" font-family="Sora, Inter, sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="url(#gradText)">Visually.</text>
  </g>

  <!-- subhead -->
  <text x="80" y="410" font-family="Inter, Segoe UI, sans-serif" font-size="26" fill="#c3cde0" font-weight="500">From your first regression line to how ChatGPT works —</text>
  <text x="80" y="446" font-family="Inter, Segoe UI, sans-serif" font-size="26" fill="#c3cde0" font-weight="500">every concept is a live demo you can drag and train.</text>

  <!-- bottom brand strip -->
  <g transform="translate(80,540)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#chipBg)"/>
    <text x="26" y="36" text-anchor="middle" font-family="Segoe UI Emoji, sans-serif" font-size="26">🧠</text>
    <text x="72" y="28" font-family="Sora, Inter, sans-serif" font-size="24" font-weight="800" fill="#eaf0fa">ML Playground</text>
    <text x="72" y="52" font-family="Inter, sans-serif" font-size="15" fill="#8b96b2">ashishyadavstudio.github.io/ML-Playground</text>
  </g>
</svg>
